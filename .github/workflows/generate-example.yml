name: Download contribution graphs
on:
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username (leave blank to use the repository owner)
        type: string
        required: false
      flight_mode:
        description: UFO personality
        type: choice
        default: classic
        options:
          - classic
          - curious
          - collector
      types:
        description: Contribution graph styles
        type: choice
        default: ufo,ghost-haunting
        options:
          - ufo,ghost-haunting
          - ufo
          - ghost-haunting
          - mimic
          - ant-heist
          - overgrown
      beam_size:
        description: Beam size level (mostly increases vertical reach)
        type: choice
        default: '1'
        options:
          - '0.5'
          - '1'
          - '1.5'
          - '2'
          - '3'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: graphs
        with:
          github_user_name: ${{ inputs.username || github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          types: ${{ inputs.types }}
          flight_mode: ${{ inputs.flight_mode }}
          beam_size: ${{ inputs.beam_size }}
          output_dir: generated
      - uses: actions/upload-artifact@v4
        with:
          name: commitcade-graphs
          path: ${{ steps.graphs.outputs.output_dir }}/*.svg
          if-no-files-found: error
